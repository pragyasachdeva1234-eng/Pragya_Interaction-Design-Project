// Ledges, measured from the background: top edge y, x range.
// The top edge of the middle piece is the collision surface.
// LEDGES[0] is the top ledge, where the trophy sits.
const LEDGES = [
  { x0: 460, x1: 1024, top: 103, oneWay: true },
  { x0: 0,   x1: 565,  top: 207, oneWay: true },
  { x0: 460, x1: 1024, top: 321, oneWay: true },
  { x0: 0,   x1: 565,  top: 428, oneWay: true },
  { x0: 0,   x1: 1024, top: 537, oneWay: false }, // ground
];

// Skill icons. ledge = index in LEDGES (4 = ground),
// x = horizontal position, icon = team / grid / art,
// k = size (1.0 = full size, 56px tall).
// team = User research, grid = Design system, art = Visual design. 5 each.
const LOGO_SPOTS = [
  // top ledge
  { ledge: 0, x: 560, icon: 'team', k: 0.7 },
  { ledge: 0, x: 720, icon: 'grid', k: 0.9 },
  // second ledge
  { ledge: 1, x: 90,  icon: 'art',  k: 1.0 },
  { ledge: 1, x: 250, icon: 'team', k: 0.8 },
  { ledge: 1, x: 420, icon: 'grid', k: 0.6 },
  // third ledge
  { ledge: 2, x: 520, icon: 'grid', k: 0.8 },
  { ledge: 2, x: 700, icon: 'art',  k: 0.7 },
  { ledge: 2, x: 900, icon: 'team', k: 1.0 },
  // fourth ledge
  { ledge: 3, x: 80,  icon: 'team', k: 0.6 },
  { ledge: 3, x: 260, icon: 'art',  k: 1.0 },
  { ledge: 3, x: 470, icon: 'grid', k: 0.8 },
  // ground
  { ledge: 4, x: 120, icon: 'grid', k: 1.0 },
  { ledge: 4, x: 330, icon: 'team', k: 0.6 },
  { ledge: 4, x: 560, icon: 'art',  k: 0.8 },
  { ledge: 4, x: 880, icon: 'art',  k: 0.7 },
];

const ICON_ORDER = ['team', 'grid', 'art'];
const ICON_LABELS = { team: 'User research', grid: 'Design system', art: 'Visual design' };

const TROPHY_X = 880;

const FIREWORK_COLORS = [0xff4d6d, 0xffd166, 0x4ecdc4, 0x9b5de5, 0xf15bb5, 0x06d6a0, 0xffffff];

class LogoCollector extends Phaser.Scene {
  constructor() {
    super('game');
  }

  preload() {
    for (const key in IMG) {
      this.load.image(key, IMG[key]);
    }
  }

  create() {
    this.won = false;
    this.collected = 0;
    this.total = LOGO_SPOTS.length;

    // Goal per icon type, and how many collected so far
    this.goal = { team: 0, grid: 0, art: 0 };
    LOGO_SPOTS.forEach(s => this.goal[s.icon]++);
    this.counts = { team: 0, grid: 0, art: 0 };

    this.physics.world.setBounds(0, 0, W, H);

    // Background
    this.add.image(0, 0, 'bg').setOrigin(0, 0);

    // Ledges
    this.floorZones = [];
    LEDGES.forEach(l => this.drawLedge(l));

    // Player
    this.player = this.physics.add.sprite(60, 440, 'char_idle');
    this.player.body.setSize(22, 56).setOffset(12, 23); // collision box around the feet
    this.player.setCollideWorldBounds(true);
    this.physics.add.collider(this.player, this.floorZones);

    // Running animation
    this.anims.create({
      key: 'run',
      frames: [0, 1, 2, 3, 4, 5].map(i => ({ key: `char_run${i}` })),
      frameRate: RUN_FPS,
      repeat: -1
    });

    // Skill icons standing on their ledges
    this.logos = LOGO_SPOTS.map(s => {
      const img = this.add.image(s.x, LEDGES[s.ledge].top - 2, 'icon_' + s.icon)
        .setOrigin(0.5, 1)
        .setScale(s.k);
      img.iconKey = s.icon;
      this.physics.add.existing(img, true); // scale is set before the body is created
      return img;
    });
    this.physics.add.overlap(this.player, this.logos, this.collectLogo, null, this);

    // Trophy on the top ledge: the final goal
    const trophyTex = this.textures.get('trophy').getSourceImage();
    const topY = LEDGES[0].top;
    this.trophyImg = this.add.image(TROPHY_X, topY, 'trophy').setOrigin(0.5, 1);
    this.trophyZone = this.add.zone(TROPHY_X, topY - trophyTex.height / 2,
                                    trophyTex.width, trophyTex.height);
    this.physics.add.existing(this.trophyZone, true);
    this.physics.add.overlap(this.player, this.trophyZone, this.reachTrophy, null, this);

    // HUD: the three skills on one horizontal line
    this.hudText = this.add.text(16, 12, '', {
      fontFamily: 'monospace', fontSize: '16px', color: '#ffffff'
    }).setScrollFactor(0).setDepth(10);
    this.updateHud();

    this.msgText = this.add.text(W / 2, 60, '', {
      fontFamily: 'monospace', fontSize: '18px', color: '#ffe08a'
    }).setOrigin(0.5).setDepth(10);

    this.winText = this.add.text(W / 2, H / 2, '', {
      fontFamily: 'monospace', fontSize: '44px', fontStyle: 'bold',
      color: WIN_COLOR, stroke: '#ffffff', strokeThickness: 6, align: 'center'
    }).setOrigin(0.5).setDepth(10);

    this.add.text(16, H - 24, 'Arrows: move    Space / Up: jump    R: restart', {
      fontFamily: 'monospace', fontSize: '14px', color: '#8892b0'
    }).setDepth(10);

    // Input
    this.cursors = this.input.keyboard.createCursorKeys();
    this.spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
    this.rKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.R);
  }

  // Draws one ledge from the art pieces. Bottoms of the end caps line up
  // with the bottom of the middle piece; the top of the middle piece is the floor.
  drawLedge(l) {
    const midH = this.textures.get('mid').getSourceImage().height;
    const capW = this.textures.get('capL').getSourceImage().width;
    const capRW = this.textures.get('capR').getSourceImage().width;
    const bottom = l.top + midH;

    // Middle section, repeated across the gap between the caps
    const midX = l.x0 + capW;
    const midW = (l.x1 - capRW) - midX;
    this.add.tileSprite(midX, l.top, midW, midH, 'mid').setOrigin(0, 0);

    // End caps
    this.add.image(l.x0, bottom, 'capL').setOrigin(0, 1);
    this.add.image(l.x1, bottom, 'capR').setOrigin(1, 1);

    // Invisible collision strip along the top edge
    const w = l.x1 - l.x0;
    const zone = this.add.rectangle(l.x0 + w / 2, l.top + 6, w, 12).setAlpha(0);
    this.physics.add.existing(zone, true);
    if (l.oneWay) {
      zone.body.checkCollision.down = false; // jump up through from below
    }
    this.floorZones.push(zone);
  }

  update() {
    if (this.won) {
      this.player.body.setVelocityX(0);
      this.setPose(0);
      if (Phaser.Input.Keyboard.JustDown(this.rKey)) {
        this.scene.restart();
      }
      return;
    }

    const body = this.player.body;
    let vx = 0;

    if (this.cursors.left.isDown) {
      vx = -MOVE_SPEED;
      this.player.setFlipX(true);
    } else if (this.cursors.right.isDown) {
      vx = MOVE_SPEED;
      this.player.setFlipX(false);
    }
    body.setVelocityX(vx);

    const jumpPressed =
      Phaser.Input.Keyboard.JustDown(this.spaceKey) ||
      Phaser.Input.Keyboard.JustDown(this.cursors.up);

    if (jumpPressed && body.touching.down) {
      body.setVelocityY(-JUMP_SPEED);
    }

    // Pick the pose
    if (!body.touching.down) {
      this.setPose(2);          // in the air
    } else if (vx !== 0) {
      this.setPose(1);          // running
    } else {
      this.setPose(0);          // standing
    }

    if (Phaser.Input.Keyboard.JustDown(this.rKey)) {
      this.scene.restart();
    }
  }

  // 0 = idle, 1 = run, 2 = jump
  setPose(pose) {
    const p = this.player;
    if (pose === 1) {
      if (!p.anims.isPlaying || p.anims.currentAnim.key !== 'run') {
        p.play('run');
      }
    } else {
      p.anims.stop();
      p.setTexture(pose === 2 ? 'char_jump' : 'char_idle');
    }
  }

  collectLogo(player, logo) {
    if (!logo.active) return;
    logo.destroy();
    this.collected++;
    this.counts[logo.iconKey]++;
    this.updateHud();
  }

  reachTrophy(player, zone) {
    if (this.won) return;
    if (this.collected < this.total) {
      this.showMsg('Collect all the icons first!');
      return;
    }

    // Win: trophy disappears and the fireworks start
    this.won = true;
    this.trophyImg.destroy();
    this.trophyZone.destroy();
    this.player.body.setVelocity(0, 0);
    this.winText.setText('You won!\nPress R to play again');
    this.startFireworks();
  }

  startFireworks() {
    this.burst(TROPHY_X, LEDGES[0].top - 40, 18);
    this.launchFirework();
    this.time.addEvent({
      delay: 380,
      repeat: 14,
      callback: () => this.launchFirework()
    });
  }

  launchFirework() {
    const x = Phaser.Math.Between(120, 900);
    const y = Phaser.Math.Between(120, 300);
    this.burst(x, y, Phaser.Math.Between(18, 26));
  }

  // Sparks that fly out from (x, y) and fade
  burst(x, y, count) {
    for (let i = 0; i < count; i++) {
      const angle = Phaser.Math.FloatBetween(0, Math.PI * 2);
      const speed = Phaser.Math.Between(60, 170);
      const color = Phaser.Utils.Array.GetRandom(FIREWORK_COLORS);
      const p = this.add.circle(x, y, Phaser.Math.Between(2, 4), color).setDepth(5);
      this.tweens.add({
        targets: p,
        x: x + Math.cos(angle) * speed,
        y: y + Math.sin(angle) * speed + 40, // a little gravity
        alpha: 0,
        scale: 0.4,
        duration: Phaser.Math.Between(700, 1100),
        ease: 'Cubic.easeOut',
        onComplete: () => p.destroy()
      });
    }
  }

  showMsg(text) {
    this.msgText.setText(text);
    if (this.msgTimer) this.msgTimer.remove();
    this.msgTimer = this.time.delayedCall(2000, () => this.msgText.setText(''));
  }

  updateHud() {
    const parts = ICON_ORDER.map(key =>
      `${ICON_LABELS[key]}: ${this.counts[key]}/${this.goal[key]}`);
    this.hudText.setText(parts.join('     '));
  }
}

new Phaser.Game({
  type: Phaser.AUTO,
  width: W,
  height: H,
  backgroundColor: '#1b2238',
  physics: {
    default: 'arcade',
    arcade: { gravity: { y: GRAVITY }, debug: false }
  },
  scene: LogoCollector
});
</script>
